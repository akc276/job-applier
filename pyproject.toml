[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-applier"
version = "0.1.0"
description = "Angular Job Search, Referral & Application Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-jobspy>=1.1.50",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyperclip>=1.8.2",
    "tabulate>=0.9.0",
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
